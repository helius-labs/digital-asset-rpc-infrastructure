[package]
name = "migration"
version = "0.7.2"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { workspace = true }
enum-iterator = { workspace = true }
enum-iterator-derive = { workspace = true }
# Force regex to include std feature for compatibility with sea-orm-cli
regex = { version = "1", features = ["std", "perf", "unicode"] }

[dependencies.sea-orm-migration]
version = "0.10.6"
features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
]
