[workspace]
members = [
  "common",
  "digital_asset_types",
  "das_api",
  "das_publisher",
  "nft_ingester",
  "migration",

  "tools/acc_forwarder",
  "tools/txn_forwarder",
  "tools/tree_status",
  "tools/bgtask_creator",
  "util-jobs",
  "integration_tests",
  "blockbuster",
  "tools/acc_backfill",
  "tools/program_backfill",
  "tools/mint_backfill",
  "das-plugin/1.17.x/plerkle_messenger",
  "das-plugin/1.17.x/plerkle_serialization",
]

resolver = "2"

[workspace.dependencies]
acc_forwarder = { path = "tools/acc_forwarder" }
anchor-client = "1.0.0"
anchor-lang = { version = "1.0.0" }
async-mutex = "1.4.0"
blake3 = "1.3.3"
governor = "0.6.0"
anyhow = "1.0.71"
async-std = { version = "^1", features = ["attributes", "tokio1"] }
async-stream = "0.3.5"
async-trait = "0.1.53"
base64 = "0.21.0"
bytemuck = { version = "1.14.0", features = ["derive"] }
blockbuster = { path = "blockbuster" }
mpl-account-compression = { version = "2.0.0", features = ["no-entrypoint", "cpi"] }
mpl-noop = { version = "2.0.0", features = ["no-entrypoint"] }
borsh = { version = "1.5", features = ["derive"] }
spl-pod = { version = "0.7.2", features = ["serde-traits"] }
bincode = "1.3.3"
bs58 = "0.4.0"
spl-token-group-interface = "=0.7.2"
spl-token-metadata-interface = "1.0.0"
spl-type-length-value = "0.9.1"
cadence = "0.29.0"
cadence-macros = "0.29.0"
chrono = "0.4.31"
clap = { version = "4.1.4", features = ["derive", "cargo"] }
common = { path = "common" }
crossbeam = "0.8.2"
das_api = { path = "das_api" }
das_publisher = { path = "das_publisher" }
digital_asset_types = { path = "digital_asset_types", features = [
  "json_types",
  "sql_types",
] }
rayon = "1.11.0"
enum-iterator = "1.2.0"
enum-iterator-derive = "1.1.0"
env_logger = "0.10.0"
figment = { version = "0.10.9", features = ["env", "test", "json"] }
flatbuffers = "23.1.21"
function_name = "0.3.0"
futures = "0.3.28"
futures-util = "0.3.27"
git2 = "0.18.1"
heck = "0.5.0"
hex = "0.4.3"
http = "0.2.12"
hyper = "0.14.23"
indexmap = "1.9.3"
insta = { version = "1.34.0", features = ["json", "redactions"] }
itertools = "0.10.1"
jsonpath_lib = "0.3.0"
jsonrpsee = { version = "0.16.2", features = ["server", "macros"] }
jsonrpsee-core = { version = "0.16.2", features = ["server"] }
lazy_static = "1.4.0"
log = "0.4.17"
metrics = "0.20.1"
migration = { path = "migration" }
mime_guess = "2.0.4"
mpl-bubblegum = "3.0.0"
mpl-core = { version = "0.12.0", features = ["serde"] }
mpl-token-metadata = { version = "5.1.2-alpha.2", features = ["serde"] }
nft_ingester = { path = "nft_ingester" }
num-derive = "0.3.3"
num-traits = "0.2.15"
once_cell = "1.19.0"
open-rpc-derive = { version = "0.0.4" }
open-rpc-schema = { version = "0.0.4" }
plerkle_messenger = { path = "das-plugin/1.17.x/plerkle_messenger", features = [
  "redis",
] }
plerkle_serialization = { path = "das-plugin/1.17.x/plerkle_serialization" }
rand = "0.9.2"
redis = { version = "0.22.3", features = [
  "aio",
  "tokio-comp",
  "streams",
  "tokio-native-tls-comp",
  "connection-manager",
] }
regex = "1.5.5"
reqwest = { version = "0.11.13", features = ["json"] }
rust-crypto = "0.2.36"
schemars = { version = "0.8.6", features = ["chrono"] }
schemars_derive = "0.8.6"
sea-orm = { version = "0.10.7", features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "postgres-array",
  "with-chrono",
  "mock",
] }
sea-query = { version = "0.28.1", features = ["postgres-array"] }
serde = "1.0.162"
serde_json = { version = "1.0.81", features = ["preserve_order"] }
serial_test = "2.0.0"
# The 4.x SDK line is required for transaction v1 (SIMD-0296) support; 4.1 is the
# first line unified on solana-transaction/solana-message 4.x. solana-message ~4.4
# and solana-sdk ~4.0 avoid the wincode 0.5/0.6 split with
# solana-transaction-status-client-types 4.1.x.
solana-account-decoder = "4.1"
solana-client = "4.1"
solana-commitment-config = "3.0.0"
solana-message = "~4.4"
solana-system-interface = "~3.2"
agave-geyser-plugin-interface = "4.1"
solana-rpc-client-api = "4.1"
solana-sdk = "~4.0"
solana-transaction-context = "4.1"
solana-transaction-error = "3.0.0"
# 4.x gates its entire API behind "agave-unstable-api"
solana-transaction-status = { version = "4.1", features = ["agave-unstable-api"] }
solana-program = "~4.0"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
# "serde" replaces the "serde-traits" feature removed from spl-token-2022 11.x
spl-token-2022-interface = { version = "3.0.0", features = ["serde"] }
solana-zk-sdk-pod = "0.1"
sqlx = { version = "0.6.2", features = [
  "macros",
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "offline",
  "json",
] }
stretto = { version = "0.8.4", features = ["async"] }
thiserror = "1.0.31"
tokio = { version = "1.23.0", features = ["full"] }
tokio-postgres = "0.7.7"
tokio-retry = "0.3.0"
tokio-stream = { version = "0.1.14", features = ["io-util"] }
tower = { version = "0.4.13", features = ["full"] }
tower-default-headers = "0.1.1"
tower-http = { version = "0.3.5", features = ["full"] }
tracing = "0.1.35"
tracing-subscriber = { version = "0.3.16", features = [
  "json",
  "env-filter",
  "ansi",
] }
txn_forwarder = { path = "tools/txn_forwarder" }
url = "2.3.1"
uuid = "1.0.0"
time = "0.3.36"
yellowstone-grpc-client = "13.3"
yellowstone-grpc-proto = "12.6"

[profile.release]
codegen-units = 16
lto = "thin"

[profile.dev]
# Sacrifice debug info and debugger usage for ~40% faster incremental compilation.
debug = 0
# Some standard library files already come precompiled with debuginfo. We strip it for faster linking
# and smaller binaries.
strip = "debuginfo"


# Dev profile with faster compilation, but no debug info
[profile.dev-fast]
# Inherit all defaults from dev profile
inherits = "dev"
# Sacrifice debug info and debugger usage for ~70% faster incremental compilation and 100% faster end-to-end compilation.
debug = 0
# Some standard library files already come precompiled with debuginfo. We strip it for faster linking
# and smaller binaries.
strip = "debuginfo"


